<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Nome da ONG</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
<h1>Nome da ONG</h1>
<nav aria-label="Navegação principal">
<ul>
<li><a href="index.html">Início</a></li>
<li><a href="projetos.html">Projetos</a></li>
<li><a href="cadastro.html">Cadastro</a></li>
</ul>
</nav>
</header>
<main>
<section id="cadastro">
<h2>Cadastro</h2>
<p>Preencha o formulário abaixo para realizar seu cadastro na ONG.</p>
<form action="#" method="post">
<fieldset>
<legend>Dados pessoais</legend>
<p><label for="nome">Nome completo:</label><br>
<input type="text" id="nome" name="nome" required autocomplete="name"></p>
<p><label for="email">E-mail:</label><br>
<input type="email" id="email" name="email" required autocomplete="email"></p>
<p><label for="nascimento">Data de nascimento:</label><br>
<input type="date" id="nascimento" name="nascimento" required></p>
<p><label for="cpf">CPF:</label><br>
<input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" title="Digite o CPF no formato 000.000.000-00" inputmode="numeric" maxlength="14" required autocomplete="off"></p>
<p><label for="telefone">Telefone:</label><br>
<input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" title="Digite o telefone no formato (99) 99999-9999" inputmode="tel" maxlength="15" required autocomplete="tel"></p>
</fieldset>
<fieldset>
<legend>Endereço</legend>
<p><label for="cep">CEP:</label><br>
<input type="text" id="cep" name="cep" placeholder="00000-000" pattern="[0-9]{5}-[0-9]{3}" title="Digite o CEP no formato 00000-000" inputmode="numeric" maxlength="9" required autocomplete="postal-code"></p>
<p><label for="endereco">Endereço:</label><br>
<input type="text" id="endereco" name="endereco" required autocomplete="address-line1"></p>
<p><label for="numero">Número:</label><br>
<input type="text" id="numero" name="numero" required></p>
<p><label for="complemento">Complemento:</label><br>
<input type="text" id="complemento" name="complemento" autocomplete="address-line2"></p>
<p><label for="cidade">Cidade:</label><br>
<input type="text" id="cidade" name="cidade" required autocomplete="address-level2"></p>
</fieldset>
<button type="submit">Enviar cadastro</button>
<button type="reset">Limpar formulário</button>
</form>
</section>
</main>
<footer id="contato">
<h2>Entre em contato</h2>
<address>
<p>E-mail: contato@ong.org.br</p>
<p>Telefone: (11) 99999-9999</p>
</address>
</footer>
<script type="module" src="../js/app.js"></script>
</body>
</html>
